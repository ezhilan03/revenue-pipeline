name: Revenue checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: revenue
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: revenue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U revenue -d revenue_test'
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      REVENUE_TEST_DATABASE_URL: postgresql://revenue:ephemeral-ci-only@127.0.0.1:5432/revenue_test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: revenue
      PGPASSWORD: ephemeral-ci-only
      PGDATABASE: revenue_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run dbt test --project-dir dbt --profiles-dir dbt
      - run: docker build -t revenue-pipeline:ci .
