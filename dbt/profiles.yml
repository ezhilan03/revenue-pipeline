revenue_pipeline:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '55447') | int }}"
      user: "{{ env_var('PGUSER', 'revenue') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'revenue') }}"
      schema: revenue
      threads: 2
