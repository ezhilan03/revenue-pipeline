[project]
name = "revenue-pipeline"
version = "0.1.0"
description = "Synthetic revenue handoff reliability and historical data modelling"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "dbt-postgres>=1.9,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
